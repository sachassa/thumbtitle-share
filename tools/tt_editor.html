<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>썸네일 제목 편집 — 원본과 맞추기</title>
<style>
:root{--bg:#1d1f24;--pn:#262a31;--ln:#3a3f48;--tx:#e8e8e8;--dim:#9aa3ad;--ac:#4db3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px 'Malgun Gothic',sans-serif;display:flex;height:100vh;overflow:hidden}
#left{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}
#bar select,#bar input,#bar button{background:#14161a;color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:3px 6px;font:inherit}
#bar button,.fbtn{cursor:pointer} .fbtn{background:#14161a;color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:3px 6px} .fbtn:hover{border-color:var(--ac)} #bar button:hover{border-color:var(--ac)}
#score{margin-left:auto;font-weight:bold}
#wrap{flex:1;overflow:auto;position:relative;background:#0c0d10}
#cv{display:block;image-rendering:pixelated;cursor:default}
#right{width:360px;background:var(--pn);border-left:1px solid var(--ln);overflow-y:auto;padding:8px 10px}
h3{margin:12px 0 4px;font-size:13px;color:var(--ac);border-bottom:1px solid var(--ln);padding-bottom:2px}
.row{display:flex;align-items:center;gap:6px;margin:3px 0}
.row label{width:92px;color:var(--dim);flex:none}
.row input[type=range]{flex:1}
.row input[type=number]{width:64px;background:#14161a;color:var(--tx);border:1px solid var(--ln);border-radius:3px;padding:1px 3px}
.row input[type=color]{width:34px;height:22px;border:none;background:none;padding:0}
.row select,.row input[type=text]{flex:1;min-width:0;background:#14161a;color:var(--tx);border:1px solid var(--ln);border-radius:3px;padding:2px}
.lines div{padding:4px 6px;border:1px solid var(--ln);border-radius:4px;margin:3px 0;cursor:pointer}
.lines div.on{border-color:var(--ac);background:#1b2a38}
.sub{border:1px solid var(--ln);border-radius:4px;padding:4px 6px;margin:4px 0}
.sub .hd{display:flex;justify-content:space-between;color:var(--dim)}
.btn{background:#14161a;color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:2px 8px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--ac)}
.presets{display:flex;flex-wrap:wrap;gap:4px}
.help{color:var(--dim);font-size:12px;line-height:1.5}
#msg{color:#fc6;padding:0 10px}
</style></head>
<body>
<div id="left">
 <div id="bar">
  <select id="vid"></select>
  보기 <select id="mode">
   <option value="rep">재현만</option><option value="orig">원본만</option>
   <option value="mix">겹쳐 보기</option><option value="diff">차이(다른 곳만 밝게)</option>
  </select>
  <span id="mixw">원본 비율 <input id="mix" type="range" min="0" max="100" value="50" style="width:90px"></span>
  배율 <select id="zoom"><option>0.5</option><option selected>1</option><option>2</option><option>3</option><option>4</option></select>
  <button id="flip" title="누르고 있는 동안 원본">누르면 원본</button>
  <button id="save" title="이 PC 서버면 값 폴더에, 아니면 파일로 내려받기">저장</button><button id="reset">처음 값으로</button>
  <label class="fbtn" title="재현 폴더(값·그림 폴더가 든 곳)를 골라 결과를 고침">폴더 열기<input type="file" id="openDir" webkitdirectory hidden></label>
  <label class="fbtn" title="아무 썸네일 그림으로 시작">그림 열기<input type="file" id="openImg" accept="image/*" hidden></label>
  <label class="fbtn" title="글자를 지운 배경 그림이 있으면">배경 바꾸기<input type="file" id="openBg" accept="image/*" hidden></label>
  <label class="fbtn" title="내 글꼴 파일(.ttf .otf .woff2) — 이름으로 찾아 씀">글꼴 넣기<input type="file" id="addFonts" accept=".ttf,.otf,.woff,.woff2,.ttc" multiple hidden></label>
  <button id="addLine" title="글자 줄을 새로 얹음">+ 줄</button>
  <label class="fbtn" title="저장해 둔 편집 값(.json)을 불러옴">편집 값 불러오기<input type="file" id="loadEdit" accept=".json" hidden></label>
  <button id="exportPng" title="지금 재현 그림을 PNG로 내려받기">그림 내보내기</button>
  <input id="yurl" placeholder="유튜브 주소 또는 영상 번호" style="width:220px" title="watch?v= · youtu.be/ · shorts/ 주소">
  <button id="ygo" title="썸네일을 받아 엶. 도구가 설치된 컴퓨터면 자동 재현(글꼴 찾기·맞추기)까지">주소로 시작</button>
  <button id="autoGo" title="지금 연 그림으로 자동 재현(도구가 설치된 컴퓨터에서만)" style="display:none">이 그림 자동 재현</button>
  <button id="jobsBtn" title="입구로 돌린 작업 목록" style="display:none">작업 목록</button>
  <span id="score"></span>
 </div>
 <div id="msg"></div>
 <div id="wrap"><canvas id="cv"></canvas></div>
</div>
<div id="right">
 <div class="help">줄을 고른 뒤 그림 위에서 끌면 옮김 · 좌우 손잡이 = 옆으로 늘리기 · 위아래 손잡이 = 위로 늘리기 · 모서리 = 크기 · 방향키 = 0.1px(Shift 1px). 점수는 봐주기 없이 화소가 완전히 같은지만 셉니다.</div>
 <h3>줄</h3><div class="lines" id="lines"></div>
 <div id="panel"></div>
</div>
<script>
// ---------- 상태 ----------
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d', {willReadFrequently: true});
let D = null, W = 0, H = 0, ORIG = null, BG = null, ODATA = null, sel = 0, E = [], fontsLoaded = {}, flipping = false;
const off = document.createElement('canvas'), octx = off.getContext('2d', {willReadFrequently: true});
// 임시 캔버스는 다시 씀: 한 번 그릴 때마다 원본 크기 캔버스를 수십 개 새로 만들면 자동 맞추기 수천 번에 메모리가 바닥남
// (2026-11-25 시험이 PC 메모리 부족으로 멈춤, 실측). 그리기 한 번(frame) 시작에 번호를 0으로 돌리고 차례로 꺼내 씀.
const POOL = []; let PI = 0;
function frame() { PI = 0; }
const tmp = () => {
  let c = POOL[PI];
  if (!c) { c = document.createElement('canvas'); POOL[PI] = c; }
  PI++;
  if (c.width !== W || c.height !== H) { c.width = W; c.height = H; } else { const g = c.getContext('2d'); g.reset ? g.reset() : (g.setTransform(1, 0, 0, 1, 0, 0), g.clearRect(0, 0, W, H)); }
  return c;
};

// 줄 하나의 편집 값 — 무료·유료 편집 프로그램(포토샵 레이어 스타일·일러스트레이터 모양·Canva 글자 효과·Krita·Penpot·Figma·
// CapCut·Fabric/Konva)의 글자 효과를 모음. 흐림 값은 모두 가우스 σ(화소)로 적는다(조사: Canvas·CSS 의 blur 숫자는 2σ, SVG 는 σ).
function defaults(L) {
  const st = []; if (L.outline_px > 0 && L.outline_color) st.push({color: L.outline_color, width: +L.outline_px, pos: 'out', join: 'round', opacity: 1});
  const sh = []; if (L.shadow) sh.push({dx: +L.shadow.dx || 0, dy: +L.shadow.dy || 0, blur: 0, spread: 0, color: L.shadow.color || '#000000', opacity: 1, blend: 'source-over', withStroke: true});
  return {dx: 0, dy: 0, scaleX: 1, scaleY: 1, spacing: 0, slant: 0, rotate: 0, bold: +L.bold_px || 0, font: '', opacity: 1, blend: 'source-over',
    fill: {mode: 'span', c1: (L.spans[0] || {}).color || '#ffffff', c2: '#ffffff', c3: '#ffffff', use3: false, mid: 0.5, angle: 90, opacity: 1},
    strokes: st, shadows: sh,
    glow: {on: false, blur: 8, spread: 0, color: '#ffffff', opacity: 0.8, blend: 'screen'},
    iglow: {on: false, blur: 4, choke: 0, color: '#ffffaa', opacity: 0.7, src: 'edge', blend: 'screen'},
    inner: {on: false, dx: 2, dy: 2, blur: 3, choke: 0, color: '#000000', opacity: 0.6, blend: 'multiply'},
    bevel: {on: false, style: 'inner', depth: 1, size: 4, soften: 0, angle: 120, altitude: 30, hi: '#ffffff', hiOp: 0.75, lo: '#000000', loOp: 0.75},
    satin: {on: false, color: '#000000', opacity: 0.5, angle: 19, dist: 6, size: 6, invert: false},
    extrude: {on: false, depth: 6, angle: 45, color: '#000000', color2: '', fade: false},
    echo: {on: false, n: 2, dx: 4, dy: 4, color: '#ff4d4d', opacity: 0.6},
    glitch: {on: false, dx: 3, dy: 0, c1: '#00ffff', c2: '#ff00ff'},
    warp: {style: 'none', bend: 0},
    box: {on: false, color: '#000000', padX: 10, padY: 6, radius: 0, opacity: 1},
    gl: L.glyphs.map(() => ({dx: 0, dy: 0, rot: 0, sc: 1}))};
}

// ---------- 불러오기: 세 가지로 열림 ----------
// ① 이 PC 서버(tt_editor.py) — 결과·그림·글꼴 다 자동
// ② 공유 주소처럼 웹에 올린 폴더(?base=<폴더>&id=<영상>) — 결과·그림은 자동, 글꼴은 받는 사람 것(파일 넣기 또는 컴퓨터에 깔린 글꼴)
// ③ 파일 하나만(서버 없음) — 「폴더 열기」(재현 폴더) 또는 「그림 열기」(아무 그림)로 시작. 저장은 파일 내려받기
const Q = new URLSearchParams(location.search);
const RQ = Q.get('r') ? 'r=' + encodeURIComponent(Q.get('r')) : '';   // 입구 작업 폴더를 볼 때
let MODE = 'local', BASE = '', LOCALF = new Map(), FONTF = new Map(), LIST = [];
const okJSON = r => r.ok && (r.headers.get('content-type') || '').includes('json');
async function start() {
  try { const r = await fetch('/list?' + RQ); if (okJSON(r)) { MODE = 'server'; LIST = await r.json(); $('#jobsBtn').style.display = ''; if (Q.get('job')) return watchJob(Q.get('job')); return fillList(); } } catch (e) {}
  if (Q.get('base') != null && location.protocol.startsWith('http')) {
    MODE = 'static'; BASE = Q.get('base').replace(/\/$/, '') || '.';
    try { LIST = await (await fetch(`${BASE}/편집기_목록.json`)).json(); } catch (e) { LIST = []; }   // 최종 화면 만들 때 같이 만드는 영상 목록
    if (Q.get('id') && !LIST.some(x => x.id === Q.get('id'))) LIST.unshift({id: Q.get('id'), title: Q.get('t') || Q.get('id')});
    if (!LIST.length) return showOpen('영상 목록(편집기_목록.json)을 못 읽었습니다. 「폴더 열기」나 「그림 열기」로 시작하세요.');
    return fillList();
  }
  MODE = 'local'; showOpen(location.protocol === 'file:' && Q.get('base') != null
    ? '파일로 열어서 결과를 바로 읽을 수 없습니다(브라우저 보안). 위 「폴더 열기」로 재현 폴더(값·그림이 든 폴더)를 고르세요.' : '');
}
function fillList() {
  $('#vid').innerHTML = LIST.map(x => `<option value="${x.id}">${(x.title || x.id).slice(0, 40)}</option>`).join('');
  const want = Q.get('id'); if (want && LIST.some(x => x.id === want)) $('#vid').value = want;
  return loadVid($('#vid').value);
}
function showOpen(note) {
  D = null; $('#vid').innerHTML = '<option>(열린 그림 없음)</option>';
  $('#panel').innerHTML = '<h3>시작하기</h3><div class="help">위 막대의 <b>폴더 열기</b> = 재현 폴더(값·그림 폴더가 든 곳)를 골라 재현 결과를 고침<br><b>그림 열기</b> = 아무 썸네일 그림으로 시작해 <b>+ 줄</b>로 글자를 얹고 효과를 줌<br><b>글꼴 넣기</b> = 내 글꼴 파일(.ttf .otf .woff2)을 넣으면 이름으로 찾아 씀<br>그림·글꼴은 이 브라우저 안에서만 쓰고 어디로도 보내지 않습니다.</div>';
  $('#lines').innerHTML = ''; msg(note || '');
}
const imgFromFile = f => img(URL.createObjectURL(f));
function img(src) { return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; }); }
async function getData(id) {
  if (MODE === 'server') return (await fetch('/data/' + id + '?' + RQ)).json();
  if (MODE === 'static') {
    const d = await (await fetch(`${BASE}/값/${id}.json`)).json(); let edit = null;
    try { const r = await fetch(`${BASE}/값/${id}_편집.json`); if (r.ok) edit = await r.json(); } catch (e) {}
    return {id, canvas: d.canvas, lines: d.lines, edit};
  }
  const f = LOCALF.get(`값/${id}.json`), fe = LOCALF.get(`값/${id}_편집.json`);
  const d = JSON.parse(await f.text()); return {id, canvas: d.canvas, lines: d.lines, edit: fe ? JSON.parse(await fe.text()) : null};
}
async function getImg(id, kind) {
  if (MODE === 'server') return img(`/img/${id}/${kind}?${RQ}&t=` + Date.now());
  if (MODE === 'static') return img(`${BASE}/그림/${id}_${kind}.png`);
  const f = LOCALF.get(`그림/${id}_${kind}.png`); if (!f) throw new Error('없음'); return imgFromFile(f);
}
// 글꼴: 서버 → 내가 넣은 글꼴 파일(이름 같음) → 컴퓨터에 깔린 같은 이름 글꼴 순서
async function font(file, name) {
  if (!file && !name) return null; const key = file || name, fam = 'F_' + key.replace(/[^A-Za-z0-9가-힣]/g, '_');
  if (fontsLoaded[fam]) return fam;
  const tries = [];
  if (MODE === 'server' && (file || name)) tries.push(`url(/font?f=${encodeURIComponent(file || '')}&n=${encodeURIComponent(name || '')})`);
  if (file && FONTF.has(file.toLowerCase())) tries.push(`url(${URL.createObjectURL(FONTF.get(file.toLowerCase()))})`);
  const stem = file ? file.replace(/\.[^.]+$/, '') : '';
  for (const n of [name, stem, stem.replace(/[-_]/g, ' ')]) if (n) tries.push(`local("${n}")`);
  for (const src of tries) {
    try { const f = new FontFace(fam, src); await f.load(); document.fonts.add(f); fontsLoaded[fam] = true; return fam; } catch (e) {}
  }
  if (name && document.fonts.check(`20px "${name}"`)) return name;   // 시스템 글꼴 이름 그대로
  MISSING.add(name || file); return null;
}
const MISSING = new Set();
async function loadVid(id) {
  msg('불러오는 중…'); MISSING.clear();
  D = await getData(id); D.lines = normLines(D.lines);
  ORIG = await getImg(id, '원본');
  try { BG = await getImg(id, '배경'); } catch (e) { BG = null; }
  await openCanvas();
  E = D.lines.map((L, i) => Object.assign(defaults(L), (D.edit && D.edit.lines && D.edit.lines[i]) || {}));
  for (const L of D.lines) L._fam = await font(L.font && L.font.file, L.font && L.font.best);
  for (const L of D.lines) if (L._noGlyph) {   // 글자 자리가 없는 줄: 잉크 상자에 맞춰 놓음
    const k = L.ink; layoutLine(L, L.text, k[0], k[3]); const w = Math.max(1, octx.measureText(L.text).width), sx = (k[2] - k[0]) / w;
    L.glyphs.forEach(g => { g.x = k[0] + (g.x - k[0]) * sx; g.sx = sx; });
  }
  E = D.lines.map((L, i) => Object.assign(defaults(L), (D.edit && D.edit.lines && D.edit.lines[i]) || {}));
  for (const e of E) if (e.font) e._fam = await font(e.font);
  sel = 0; drawLines(); panel(); setZoom(); render();
  msg([BG ? '' : '배경 그림(글자 지운 것)이 없어 원본 위에 그립니다.', MISSING.size ? `글꼴을 못 찾음: ${[...MISSING].join(', ')} — 「글꼴 넣기」로 그 글꼴 파일을 넣으면 맞게 그려집니다(지금은 대신 글꼴).` : ''].join(' '));
}
// 결과 파일마다 생김새가 조금 다름(롱폼 시험판: 글꼴이 이름 글자 하나, 글자 자리 없이 잉크 상자만) — 편집기가 쓰는 꼴로 맞춤
function normLines(lines) {
  return (lines || []).filter(L => L && L.text).map(L => {
    if (typeof L.font === 'string') L.font = {best: L.font, file: ''};
    L.font = L.font || {best: '', file: ''}; L.slant = L.slant || 0;
    if (!L.spans || !L.spans.length) L.spans = [{i0: 0, i1: [...L.text].length - 1, color: '#ffffff'}];
    if (!L.glyphs || !L.glyphs.length) {
      const k = L.ink || [0, 0, 100, 40]; L.ink = k; L.size_px = L.size_px || Math.round((k[3] - k[1]) * 1.25); L._noGlyph = true; L.glyphs = [];
    }
    return L;
  });
}
async function openCanvas() {
  W = ORIG.width; H = ORIG.height; cv.width = W; cv.height = H; off.width = W; off.height = H;
  octx.drawImage(ORIG, 0, 0); ODATA = octx.getImageData(0, 0, W, H).data;
}
// 폴더 열기(재현 폴더): 값/<영상>.json 과 그림/<영상>_원본.png 가 있는 영상을 목록으로
$('#openDir').onchange = async ev => {
  LOCALF = new Map(); let titles = {};
  for (const f of ev.target.files) {
    const parts = f.webkitRelativePath.split('/'), rel = parts.slice(-2).join('/');
    LOCALF.set(rel, f);
    if (f.name === '영상목록.json') try { let L = JSON.parse(await f.text()); L = Array.isArray(L) ? L : (L.vids || L.videos || []); for (const x of L) titles[x.id || x.video_id] = x.t || x.title; } catch (e) {}
    if (/\.(ttf|otf|woff2?|ttc)$/i.test(f.name)) FONTF.set(f.name.toLowerCase(), f);
  }
  LIST = [...LOCALF.keys()].filter(k => /^값\/[A-Za-z0-9_-]{11}\.json$/.test(k)).map(k => k.slice(2, 13)).filter(id => LOCALF.has(`그림/${id}_원본.png`)).map(id => ({id, title: titles[id] || id}));
  if (!LIST.length) return msg('그 폴더에 재현 결과(값/<영상>.json + 그림/<영상>_원본.png)가 없습니다.');
  MODE = 'local'; fillList();
};
// 그림 열기: 아무 그림으로 시작(줄은 + 줄 로 더함)
$('#openImg').onchange = ev => { if (ev.target.files[0]) openImageFile(ev.target.files[0]); };
async function openImageFile(f) {
  ORIG = await imgFromFile(f); BG = null; MODE = 'local';
  D = {id: f.name.replace(/\.[^.]+$/, ''), canvas: [ORIG.width, ORIG.height], lines: [], edit: null};
  $('#vid').innerHTML = `<option>${f.name}</option>`; await openCanvas(); E = []; sel = 0; drawLines(); panel(); setZoom(); render();
  UPFILE = f; if (MODE === 'server') $('#autoGo').style.display = '';

  const PE = fitParams(e, true), PA = fitParams(e, false), R = maxRounds || 60;
  // 단계마다 선명한 차이로 가장 좋았던 값을 기억 — 흐린 비교에서 움직인 값이 선명하게 보면 더 나쁠 수 있음(2026-11-25 흐린 그림자 시험, 실측)
  const strip = o => JSON.parse(JSON.stringify(o, (k, v) => k === '_fam' ? undefined : v));
  let keep = strip(e), keepD = n0;
  const mark = () => { const d = lineDiff(sel).mean; if (d < keepD) { keepD = d; keep = strip(e); } else Object.assign(e, strip(keep), {_fam: e._fam}); };
  // 순서: 효과 값 먼저(①②) → 넓게 훑기(⓪) → 전부. 훑기를 맨 앞에 두면 늘리기가 효과 몫을 대신 메워 입체·상자·휘기가 틀어짐(2026-11-25 시험, 실측)
  if (PE.length) { evals += await descend(e, PE, 3, R, say, '① 효과만·흐리게'); mark(); evals += await descend(e, PE, 0, R, say, '② 효과만'); mark(); }
  // ⓪ 넓게 훑기: 옮기기(가로·세로 ±30px)와 늘리기(0.8~1.25)를 많이 흐린 비교로 하나씩 다 대 봄 — 7px 옮김을 자간·늘리기로
  //    대신 맞춰 엉뚱한 데서 멈춤(2026-11-25 시험, 실측)
  for (const [p, lo, hi, st] of [['dx', -30, 30, 1], ['dy', -30, 30, 1], ['scaleX', 0.8, 1.25, 0.01], ['scaleY', 0.8, 1.25, 0.01], ['dx', -4, 4, 0.25]]) {
    const v0 = get(e, p), base = p === 'dx' && lo === -4 ? v0 : (p.startsWith('scale') ? 0 : v0); let bv = v0, bd = lineDiff(sel, 8).mean; evals++;
    for (let t = lo; t <= hi + 1e-9; t += st) { const v = p.startsWith('scale') ? +(v0 * t).toFixed(5) : base + t; set(e, p, v); const d = lineDiff(sel, 8).mean; evals++; if (d < bd - 1e-9) { bd = d; bv = v; } }
    set(e, p, bv); say(`⓪ 넓게 훑기 ${p} → ${(+bv).toFixed(3)}`); await new Promise(r => setTimeout(r, 0));
  }
  mark();
  const steps = [];
  steps.push([PA, 8, '③ 전부·많이 흐리게'], [PA, 3, '④ 전부·흐리게'], [PA, 0, '⑤ 전부']);
  for (const [P, sg, tag] of steps) { evals += await descend(e, P, sg, R, say, tag); mark(); if (keepD === 0) break; }
  if (keepD > 0) { evals += await pairs(e, PE.length ? PE : PA, 0, say, '⑥ 두 값 같이'); mark(); }
  // ⑥-2 0으로 되돌려 보기: 퍼짐·덧굵기·경계 감소·자간은 「없음(0)」이 흔한데, 조금 넣고 다른 값을 낮춰 서로 메우는 자리에 멈추기 쉬움
  //   (2026-11-25 바깥 광선 시험: 정답 퍼짐 0 → 0.105 + 불투명 0.74 로 멈춤, 실측). 0으로 두고 나머지를 다시 맞춰 더 나으면 씀.
  for (const [p] of PA) {
    if (keepD === 0) break;
    const last = p.split('.').pop(); if (!['spread', 'bold', 'choke', 'spacing'].includes(last) || Math.abs(get(e, p)) < 1e-9) continue;
    set(e, p, 0); const rest = (PE.length ? PE : PA).filter(([q]) => q !== p);
    evals += await descend(e, rest, 0, R, say, `⑥-2 ${p} 0으로`); mark();
  }
  if (keepD > 0) { evals += await descend(e, PA, 0, R * 2, say, '⑦ 마무리', 4096); mark(); }
  FITBOX = null; panel(true); render();
  say(`끝 · 평균 차이 ${n0.toFixed(3)} → ${keepD.toFixed(4)} (${evals}번 그림). 숫자는 오른쪽 칸에 들어감 — 저장을 눌러야 파일에 남음`);
  return {before: n0, after: keepD, evals};
}

// ---------- 스스로 시험(?test=1): 정답 값을 아는 가짜 원본을 만들고, 다른 값에서 출발해 자동 맞추기가 정답을 되찾는지 ----------
const TESTS = [
  ['위치·늘리기', e => { e.dx = 7; e.scaleX = 1.1; }, e => { e.dx = 0; e.scaleX = 1; }, ['dx', 'scaleX']],
  ['바깥 테두리', e => { e.strokes = [{color: '#000000', width: 6, pos: 'out', join: 'round', opacity: 1}]; }, e => { e.strokes[0].width = 3; }, ['strokes.0.width']],
  ['흐린 그림자', e => { e.shadows = [{dx: 5, dy: 4, blur: 3, spread: 0, color: '#000000', opacity: 0.6, blend: 'source-over', withStroke: true}]; }, e => Object.assign(e.shadows[0], {dx: 3, dy: 2, blur: 1, opacity: 0.4}), ['shadows.0.dx', 'shadows.0.dy', 'shadows.0.blur', 'shadows.0.opacity']],
  ['바깥 광선', e => Object.assign(e.glow, {on: true, blur: 6, spread: 0, color: '#ffff00', opacity: 0.8, blend: 'source-over'}), e => Object.assign(e.glow, {blur: 3, opacity: 0.5}), ['glow.blur', 'glow.opacity']],
  ['안쪽 그림자', e => Object.assign(e.inner, {on: true, dx: 3, dy: 3, blur: 2, choke: 0, color: '#000000', opacity: 0.6}), e => Object.assign(e.inner, {dx: 1, dy: 1, blur: 1, opacity: 0.3}), ['inner.dx', 'inner.dy', 'inner.blur', 'inner.opacity']],
  ['입체', e => Object.assign(e.extrude, {on: true, depth: 8, angle: 45, color: '#000000'}), e => Object.assign(e.extrude, {depth: 5, angle: 30}), ['extrude.depth', 'extrude.angle']],
  ['엠보스', e => Object.assign(e.bevel, {on: true, style: 'inner', depth: 2, size: 5, soften: 0, angle: 120, altitude: 30}), e => Object.assign(e.bevel, {depth: 1, size: 3, angle: 90}), ['bevel.size', 'bevel.depth', 'bevel.angle']],
  ['배경 상자', e => Object.assign(e.box, {on: true, color: '#202020', padX: 12, padY: 8, radius: 6, opacity: 1}), e => Object.assign(e.box, {padX: 6, padY: 4, radius: 0}), ['box.padX', 'box.padY', 'box.radius']],
  ['휘기(부채꼴)', e => { e.warp = {style: 'arc', bend: 0.2}; }, e => { e.warp.bend = 0.1; }, ['warp.bend']],
];
async function selfTest() {
  const out = [], real = ODATA, clean = () => { const e = defaults(D.lines[sel]); PRESETS['효과 모두 끄기'](e); return e; };
  const want = new URLSearchParams(location.search).get('test');
  if (want === 'probe') {   // 바깥 광선 차이 지형: 정답(흐림 6, 불투명 0.8) 둘레에서 값마다 차이를 잼
    E = D.lines.map(L => { const e = defaults(L); PRESETS['효과 모두 끄기'](e); return e; }); const e = E[sel];
    Object.assign(e.glow, {on: true, blur: 6, spread: 0, color: '#ffff00', opacity: 0.8, blend: 'source-over'});
    frame(); octx.clearRect(0, 0, W, H); octx.drawImage(BG || ORIG, 0, 0); D.lines.forEach((L, k) => drawLine(octx, k)); ODATA = octx.getImageData(0, 0, W, H).data;
    const B = editedBox(sel); FITBOX = {x0: B.x0 - 80, y0: B.y0 - 80, x1: B.x1 + 80, y1: B.y1 + 80};
    const rows = [];
    for (const b of [5.5, 5.75, 5.9, 5.95, 6, 6.05, 6.1, 6.25, 6.5]) { const r = [b]; for (const o of [0.7, 0.74, 0.78, 0.8, 0.82, 0.86]) { e.glow.blur = b; e.glow.opacity = o; r.push(+lineDiff(sel).mean.toFixed(4)); } rows.push(r); }
    // 같은 값으로 두 번 그려도 똑같은가(흐림이 매번 같은지)
    e.glow.blur = 6; e.glow.opacity = 0.8; const a1 = lineDiff(sel), a2 = lineDiff(sel); FITBOX = null;
    const pre = document.createElement('pre'); pre.id = 'testout'; pre.textContent = JSON.stringify({cols: [0.7, 0.74, 0.78, 0.8, 0.82, 0.86], rows, again: [a1.mean, a1.same, a1.n, a2.mean]}); document.body.appendChild(pre); return;
  }
  for (const [name, setT, setS, keys] of TESTS) {
    if (want && want !== '1' && !name.includes(want)) continue;
    const t0 = performance.now(); E = D.lines.map(L => { const e = defaults(L); PRESETS['효과 모두 끄기'](e); return e; });
    const e = E[sel]; setT(e); const truth = keys.map(k => get(e, k));
    frame(); octx.clearRect(0, 0, W, H); octx.drawImage(BG || ORIG, 0, 0); D.lines.forEach((L, k) => drawLine(octx, k));
    ODATA = octx.getImageData(0, 0, W, H).data;           // 가짜 원본 = 정답 값으로 그린 그림
    setS(e); const start = keys.map(k => get(e, k));
    const r = await autoFit(); const got = keys.map(k => get(e, k)); const B0 = editedBox(sel); FITBOX = {x0: B0.x0 - 80, y0: B0.y0 - 80, x1: B0.x1 + 80, y1: B0.y1 + 80}; const dd = lineDiff(sel); FITBOX = null;
    const ev = {}; for (const k of ['dx','dy','scaleX','scaleY','spacing','bold','slant']) if (Math.abs(get(e, k) - get(defaults(D.lines[sel]), k)) > 1e-9 && !keys.includes(k)) ev[k] = +get(e, k).toFixed(4);
    const grp = keys[0].includes('.') ? keys[0].split('.')[0] : null;
    out.push({name, keys, truth, start, drift: ev, whole: grp ? JSON.parse(JSON.stringify(e[grp])) : null, got: got.map(v => +v.toFixed(4)), same: dd.same, n: dd.n, before: +r.before.toFixed(3), after: +r.after.toFixed(4), evals: r.evals, sec: +((performance.now() - t0) / 1000).toFixed(1)});
    ODATA = real;
  }
  const pre = document.createElement('pre'); pre.id = 'testout'; pre.textContent = JSON.stringify(out); document.body.appendChild(pre);
}

// ---------- 저장·처음 값 ----------
$('#save').onclick = async () => {
  if (!D) return; const body = editJSON();
  if (MODE === 'server') { const r = await (await fetch('/save/' + D.id + '?' + RQ, {method: 'POST', body: JSON.stringify(body)})).json(); return msg(r['저장'] ? '저장함: ' + r['저장'] : '저장 못 함: ' + JSON.stringify(r)); }
  download(`${D.id}_편집.json`, new Blob([JSON.stringify(body, null, 1)], {type: 'application/json'})); msg(`${D.id}_편집.json 으로 내려받음(서버 없이 열어서 파일로 저장)`);
};
$('#reset').onclick = () => { if (!D) return; E = D.lines.map(L => defaults(L)); panel(); render(); msg('처음 값으로 돌림(저장 전까지 파일은 그대로)'); };
function setZoom() { const z = +$('#zoom').value; cv.style.width = W * z + 'px'; cv.style.height = H * z + 'px'; render(); }
$('#zoom').onchange = setZoom; $('#mode').onchange = () => { $('#mixw').style.display = $('#mode').value === 'mix' ? '' : 'none'; render(); };
$('#mix').oninput = render; $('#vid').onchange = () => loadVid($('#vid').value);
$('#mixw').style.display = 'none';
start().then(async () => { const q = Q;
  if (q.get('test')) return selfTest();
  if (q.get('fit') != null) {   // 시험용: ?fit=<줄 번호> — 그 줄을 원본에 맞춰 보고 결과를 글로 남김(저장은 안 함)
    sel = +q.get('fit'); drawLines(); panel(); const before = lineDiff(sel); const r = await autoFit(); const after = lineDiff(sel);
    const strip = o => JSON.parse(JSON.stringify(o, (k, v) => k === '_fam' || k === 'gl' ? undefined : v));
    const pre = document.createElement('pre'); pre.id = 'testout'; pre.textContent = JSON.stringify({line: sel, before: [before.same, before.n, before.mean], after: [after.same, after.n, after.mean], evals: r.evals, edit: strip(E[sel])}); document.body.appendChild(pre);
  } }).catch(e => msg('불러오기 오류: ' + e));
</script>
